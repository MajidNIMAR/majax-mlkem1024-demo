[package]
name = "majax-mlkem"
version = "0.1.0"
edition = "2021"
description = "Development library and JSON CLI for the FIPS 203 ML-KEM parameter sets"
license = "Apache-2.0"
rust-version = "1.93"
publish = false

[features]
default = ["native"]
deterministic-testing = []
native = ["pqcrypto-mlkem/avx2", "pqcrypto-mlkem/neon"]

[lib]
name = "majax_mlkem"
path = "src/lib.rs"

[[bin]]
name = "mlkem-cli"
path = "src/main.rs"

[[bin]]
name = "mlkem-bench"
path = "src/bin/benchmark.rs"

[dependencies]
base64 = "=0.21.7"
pqcrypto-mlkem = { version = "=0.1.1", default-features = false, features = ["std"] }
pqcrypto-traits = "=0.3.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = false
