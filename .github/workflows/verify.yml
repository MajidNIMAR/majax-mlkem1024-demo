name: Verify demonstration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the downstream consumer and public documentation
        run: sh scripts/test-integration.sh

      - name: Upload integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: majax-mlkem-integration
          path: artifacts/integration/
          if-no-files-found: error

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify shell syntax
        run: sh -n scripts/*.sh

      - name: Verify reproducible release binary
        run: sh scripts/reproducible-build.sh

      - name: Verify included binary checksum
        run: sha256sum --check CHECKSUMS.sha256

      - name: Verify Rust library quality
        run: |
          docker run --rm \
            -v "$PWD/engine:/src" \
            -w /src \
            rust:1.93-bookworm@sha256:7c4ae649a84014c467d79319bbf17ce2632ae8b8be123ac2fb2ea5be46823f31 \
            sh -c 'rustup component add rustfmt clippy >/dev/null && cargo fmt -- --check && cargo clippy --locked --all-features --all-targets -- -D warnings && cargo test --locked && cargo test --locked --features deterministic-testing'

      - name: Test source build
        run: sh scripts/test-all.sh

      - name: Test included x86-64 binary
        run: sh scripts/test-prebuilt.sh

      - name: Generate image identity and SPDX and CycloneDX SBOMs
        run: sh scripts/generate-sbom.sh majax-kem-demo:1.0.0

      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: majax-kem-demo-verification
          path: artifacts/
          if-no-files-found: error

  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run memory, timing and bounded fuzzing checks
        env:
          FUZZ_SECONDS: "15"
        run: sh scripts/run-assurance.sh

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: majax-mlkem-assurance
          path: artifacts/assurance/
          if-no-files-found: warn

  performance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare portable and native backends
        env:
          BENCH_ITERATIONS: "250"
        run: sh scripts/run-benchmarks.sh

      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: majax-mlkem-performance-${{ matrix.platform }}
          path: artifacts/performance/
          if-no-files-found: error
