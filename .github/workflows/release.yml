name: Publish verifiable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release binary
        run: sh scripts/build-engine.sh "${{ matrix.platform }}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: majax-mlkem-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/mlkem-cli
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Resolve release tag
        id: release
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: majax-mlkem-*
          path: downloaded

      - name: Assemble release bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          mkdir -p release
          install -m 0555 downloaded/majax-mlkem-linux-x86_64/mlkem-cli release/mlkem-cli-linux-x86_64
          install -m 0555 downloaded/majax-mlkem-linux-aarch64/mlkem-cli release/mlkem-cli-linux-aarch64
          git archive --format=tar --prefix="majax-mlkem-${RELEASE_TAG}/" "$RELEASE_TAG" | gzip -n > "release/majax-mlkem-${RELEASE_TAG}-source.tar.gz"
          docker build --tag majax-kem-demo:release .
          sh scripts/generate-sbom.sh majax-kem-demo:release
          cp artifacts/*.spdx.json artifacts/*.cyclonedx.json release/
          (cd release && sha256sum mlkem-cli-* *.tar.gz *.json > SHA256SUMS)

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with Sigstore
        working-directory: release
        run: |
          set -eu
          for artifact in mlkem-cli-* *.tar.gz *.spdx.json *.cyclonedx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/mlkem-cli-linux-x86_64
            release/mlkem-cli-linux-aarch64
            release/*.tar.gz
            release/*.spdx.json
            release/*.cyclonedx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Majax ML-KEM ${RELEASE_TAG}"
          gh release upload "$RELEASE_TAG" release/* --clobber
