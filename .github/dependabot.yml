version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /examples/rust-consumer
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
